  <line x1="150" y1="286" x2="150" y2="298" stroke="#1E7A6C" stroke-width="2"/>
  <text class="tickl" x="150" y="338" text-anchor="middle" fill="#1E7A6C">Period</text>
  <text class="ticks" x="150" y="352" text-anchor="middle">starts</text>
  <line x1="590" y1="286" x2="590" y2="298" stroke="#1E7A6C" stroke-width="2"/>
  <text class="tickl" x="590" y="338" text-anchor="middle" fill="#1E7A6C">Period</text>
  <text class="ticks" x="590" y="352" text-anchor="middle">ends</text>
  <line x1="660" y1="286" x2="660" y2="298" stroke="#66788A" stroke-width="2"/>
  <text class="tickl" x="660" y="338" text-anchor="middle" fill="#66788A">Report</text>
  <text class="ticks" x="660" y="352" text-anchor="middle">issued</text>
  <line x1="870" y1="286" x2="870" y2="298" stroke="#26323F" stroke-width="2"/>
  <text class="tickl" x="870" y="338" text-anchor="middle" fill="#26323F">Today</text>
  <line x1="870" y1="120" x2="870" y2="286" stroke="#26323F" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
  <rect x="60" y="376" width="404" height="76" rx="9" fill="#E7F3F0" stroke="#1E7A6C" stroke-width="1.5"/>
  <text class="boxh" x="82" y="401" fill="#1E7A6C">Sampled, not exhaustive</text>
  <text class="boxb" x="82" y="422">Within the period the auditor tests a sample. A clean</text>
  <text class="boxb" x="82" y="439">opinion does not mean every event was examined.</text>
  <rect x="496" y="376" width="404" height="76" rx="9" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.5"/>
  <text class="boxh" x="518" y="401" fill="#A8711C">Retrospective, not current</text>
  <text class="boxb" x="518" y="422">The opinion closes with the period. Everything since</text>
  <text class="boxb" x="518" y="439">carries no assurance from this letter.</text>
  <text class="cap" x="480" y="476" text-anchor="middle">One letter, one closed window. Trust in the interval after it is inference, not evidence.</text>
  <line x1="33" y1="490" x2="927" y2="490" stroke="#D3DCE3" stroke-width="1"/>
