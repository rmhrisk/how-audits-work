<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 775" width="960" height="775" role="img" aria-label="One trace through the control matrix: BR 9.6.3 subscriber obligations imposed via ACME and the Subscriber Agreement, evidenced and tested">
  <style>
    .eyebrow { font: 600 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2.5px; fill:#66788A; }
    .subtitle { font: italic 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .rail { font: 600 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2px; }
    .t { font: 600 13.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .tm { font: 600 13px 'SF Mono',Consolas,Menlo,monospace; }
    .body { font: 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#26323F; }
    .sub { font: 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .chk { font: 600 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#A84A38; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66788A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="775" fill="#FFFFFF"/>

  <text class="eyebrow" x="33" y="40">ONE TRACE THROUGH THE CONTROL MATRIX</text>
  <text class="subtitle" x="33" y="62">How a requirement on the Subscriber is imposed, documented, and tested.</text>

  <!-- REQUIREMENT -->
  <text class="rail" x="165" y="134" text-anchor="end" fill="#3F5DA8">REQUIREMENT</text>
  <rect x="180" y="90" width="720" height="76" rx="9" fill="#EDF1FA" stroke="#3F5DA8" stroke-width="1.5"/>
  <text class="tm" x="204" y="115" fill="#3F5DA8">TLS BR &#167;9.6.3 Subscriber representations and warranties</text>
  <text class="body" x="204" y="136">The CA must bind the Subscriber, through a legally enforceable agreement, to obligations that</text>
  <text class="body" x="204" y="153">include protecting the Private Key and promptly requesting revocation on suspected compromise.</text>
  <line x1="540" y1="166" x2="540" y2="190" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- CONTROL -->
  <text class="rail" x="165" y="238" text-anchor="end" fill="#1E7A6C">CONTROL</text>
  <rect x="180" y="194" width="720" height="76" rx="9" fill="#E7F3F0" stroke="#1E7A6C" stroke-width="1.5"/>
  <text class="t" x="204" y="219" fill="#1E7A6C">All certificate issuance happens via ACME (RFC 8555)</text>
  <text class="body" x="204" y="240">The protocol requires the account holder to accept the Subscriber Agreement before any</text>
  <text class="body" x="204" y="257">order proceeds; agreement is captured on the ACME account (termsOfServiceAgreed).</text>
  <line x1="540" y1="270" x2="540" y2="294" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- POLICY: two documents -->
  <text class="rail" x="165" y="352" text-anchor="end" fill="#A8711C">POLICY</text>
  <path d="M 180 298 h 308 l 22 22 v 78 h -330 z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 488 298 v 22 h 22 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="tm" x="204" y="326" fill="#7A5514">CPS &#167;9.6.3</text>
  <text class="body" x="204" y="349">Commits: every Subscriber accepts the</text>
  <text class="body" x="204" y="366">Agreement before any certificate issues.</text>

  <line x1="514" y1="347" x2="562" y2="347" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <path d="M 570 298 h 308 l 22 22 v 78 h -330 z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 878 298 v 22 h 22 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="tm" x="594" y="326" fill="#7A5514">Subscriber Agreement</text>
  <text class="body" x="594" y="349">Explains the obligation: protect the key,</text>
  <text class="body" x="594" y="366">report compromise, cease use on revocation.</text>

  <line x1="540" y1="398" x2="540" y2="422" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- EVIDENCE: three record chips -->
  <text class="rail" x="165" y="472" text-anchor="end" fill="#6D4A9C">EVIDENCE</text>
  <rect x="180" y="426" width="226" height="84" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="tm" x="200" y="452" fill="#4E3570">Issuance logs</text>
  <text class="sub" x="200" y="472">every certificate traces</text>
  <text class="sub" x="200" y="488">to an ACME order</text>

  <rect x="427" y="426" width="226" height="84" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="tm" x="447" y="452" fill="#4E3570">Account records</text>
  <text class="sub" x="447" y="472">termsOfServiceAgreed</text>
  <text class="sub" x="447" y="488">captured per account</text>

  <rect x="674" y="426" width="226" height="84" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="tm" x="694" y="452" fill="#4E3570">Published SA versions</text>
  <text class="sub" x="694" y="472">obligation text, dated</text>
  <text class="sub" x="694" y="488">version history</text>

  <line x1="540" y1="510" x2="540" y2="534" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- AUDITOR TEST -->
  <text class="rail" x="165" y="590" text-anchor="end" fill="#A84A38">AUDITOR TEST</text>
  <rect x="180" y="538" width="720" height="106" rx="9" fill="#F8ECE9" stroke="#A84A38" stroke-width="1.5"/>
  <text class="t" x="204" y="563" fill="#A84A38">The auditor walks the trace</text>
  <text class="body" x="204" y="586"><tspan class="chk">a.</tspan>  Confirm every issuance path goes through ACME, with no side doors.</text>
  <text class="body" x="204" y="605"><tspan class="chk">b.</tspan>  Confirm ACME refuses issuance without Subscriber Agreement acceptance.</text>
  <text class="body" x="204" y="624"><tspan class="chk">c.</tspan>  Confirm the Agreement states the obligations &#167;9.6.3 requires.</text>
  <line x1="540" y1="644" x2="540" y2="668" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- CONCLUSION -->
  <text class="rail" x="165" y="700" text-anchor="end" fill="#2E7D46">CONCLUSION</text>
  <rect x="330" y="672" width="420" height="56" rx="9" fill="#EAF4EE" stroke="#2E7D46" stroke-width="1.5"/>
  <text class="t" x="540" y="695" text-anchor="middle" fill="#2E7D46">Trace complete, requirement satisfied</text>
  <text class="sub" x="540" y="714" text-anchor="middle">one row of the matrix, one conclusion toward the opinion</text>

  <line x1="33" y1="752" x2="927" y2="752" stroke="#D3DCE3" stroke-width="1"/>
</svg>
