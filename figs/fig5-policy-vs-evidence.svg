<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 482" width="960" height="482" role="img" aria-label="A CPS commitment on the left, operational evidence on the right, connected by the control matrix">
  <style>
    .eyebrow { font: 600 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2.5px; fill:#66788A; }
    .side { font: 600 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2px; }
    .quote { font: italic 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#26323F; }
    .note { font: 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .label { font: 600 13.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#1E7A6C; }
    .ev { font: 600 12px 'SF Mono',Consolas,Menlo,monospace; fill:#4E3570; }
    .evsub { font: 10px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .cap { font: italic 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66788A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="482" fill="#FFFFFF"/>

  <text class="eyebrow" x="33" y="40">DOCUMENTATION IS NOT EVIDENCE</text>

  <!-- left: CPS document -->
  <text class="side" x="48" y="86" fill="#A8711C">WHAT THE CPS SAYS</text>
  <path d="M 48 100 h 284 l 26 26 v 254 h -310 z" fill="#FFFFFF" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 332 100 v 26 h 26 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <rect x="72" y="130" width="180" height="5" rx="2.5" fill="#DFE6EB"/>
  <rect x="72" y="146" width="220" height="5" rx="2.5" fill="#DFE6EB"/>
  <text class="quote" x="72" y="192">&#8220;CA private keys are generated</text>
  <text class="quote" x="72" y="214">and maintained in approved</text>
  <text class="quote" x="72" y="236">hardware security modules.&#8221;</text>
  <rect x="72" y="262" width="220" height="5" rx="2.5" fill="#DFE6EB"/>
  <rect x="72" y="278" width="164" height="5" rx="2.5" fill="#DFE6EB"/>
  <text class="note" x="72" y="330">a commitment,</text>
  <text class="note" x="72" y="346">the intended design of a control</text>

  <!-- middle: control matrix bridge -->
  <line x1="358" y1="234" x2="394" y2="234" stroke="#66788A" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="398" y="206" width="164" height="56" rx="9" fill="#E7F3F0" stroke="#1E7A6C" stroke-width="2.5"/>
  <text class="label" x="480" y="230" text-anchor="middle">Control matrix</text>
  <text class="evsub" x="480" y="248" text-anchor="middle">connects claim to proof</text>
  <line x1="562" y1="234" x2="598" y2="234" stroke="#66788A" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- right: evidence stack -->
  <text class="side" x="602" y="86" fill="#6D4A9C">WHAT THE EVIDENCE SHOWS</text>
  <rect x="602" y="100" width="310" height="56" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="ev" x="626" y="124">Key ceremony records</text>
  <text class="evsub" x="626" y="142">who, when, witnessed by whom</text>

  <rect x="602" y="170" width="310" height="56" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="ev" x="626" y="194">HSM configuration</text>
  <text class="evsub" x="626" y="212">modes, roles, firmware state</text>

  <rect x="602" y="240" width="310" height="56" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="ev" x="626" y="264">Access logs</text>
  <text class="evsub" x="626" y="282">who touched what, and when</text>

  <rect x="602" y="310" width="310" height="56" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="ev" x="626" y="334">Inventory &amp; change records</text>
  <text class="evsub" x="626" y="352">every key accounted for</text>

  <!-- caption -->
  <text class="cap" x="480" y="416" text-anchor="middle">Policies establish expectations. Evidence establishes what happened.</text>
  <text class="cap" x="480" y="436" text-anchor="middle">The control matrix connects the two.</text>
  <line x1="33" y1="464" x2="927" y2="464" stroke="#D3DCE3" stroke-width="1"/>
</svg>
