<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Timeline showing that an audit covers a period that has already closed, samples within that period, and says nothing about the interval between the period end and today">
  <style>
