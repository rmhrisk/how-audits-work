<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Artifact map: generic audit artifacts and their WebTrust for CAs instantiations">
  <style>
    .eyebrow { font: 600 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2.5px; fill:#66788A; }
    .colhead { font: 600 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2px; fill:#66788A; }
    .artifact { font: 600 13.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .body { font: 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#26323F; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>

  <text class="eyebrow" x="33" y="40">THE WEBTRUST FOR CAs ARTIFACT MAP</text>

  <text class="colhead" x="48" y="76">GENERIC ARTIFACT</text>
  <text class="colhead" x="300" y="76">WEBTRUST FOR CAs INSTANTIATION</text>
  <line x1="33" y1="86" x2="927" y2="86" stroke="#D3DCE3" stroke-width="1"/>

  <!-- Row 1: Management assertion (y=92) -->
  <rect x="33" y="102" width="4" height="38" rx="2" fill="#26323F"/>
  <text class="artifact" x="48" y="126" fill="#26323F">Management assertion</text>
  <text class="body" x="300" y="117">The CA&#8217;s assertion letter, management&#8217;s written claim that, for the stated period,</text>
  <text class="body" x="300" y="134">it operated in conformance with the applicable WebTrust criteria.</text>
  <line x1="33" y1="150" x2="927" y2="150" stroke="#E7EDF1" stroke-width="1"/>

  <!-- Row 2: Applicable criteria (y=150) -->
  <rect x="33" y="160" width="4" height="38" rx="2" fill="#3F5DA8"/>
  <text class="artifact" x="48" y="184" fill="#3F5DA8">Applicable criteria</text>
  <text class="body" x="300" y="175">The WebTrust Principles and Criteria for the engagement, WebTrust for CAs plus the</text>
  <text class="body" x="300" y="192">Baseline / Network Security criteria, which incorporate the CA/Browser Forum requirements.</text>
  <line x1="33" y1="208" x2="927" y2="208" stroke="#E7EDF1" stroke-width="1"/>

  <!-- Row 3: Audit scope (y=208) -->
  <rect x="33" y="218" width="4" height="38" rx="2" fill="#3F5DA8"/>
  <text class="artifact" x="48" y="242" fill="#3F5DA8">Audit scope</text>
  <text class="body" x="300" y="233">The specific roots, subordinate CAs, certificate services, locations, and period covered,</text>
  <text class="body" x="300" y="250">enumerated in the report and the assertion.</text>
  <line x1="33" y1="266" x2="927" y2="266" stroke="#E7EDF1" stroke-width="1"/>

  <!-- Row 4: Control matrix (y=266) -->
  <rect x="33" y="276" width="4" height="38" rx="2" fill="#1E7A6C"/>
  <text class="artifact" x="48" y="300" fill="#1E7A6C">Control matrix</text>
  <text class="body" x="300" y="291">The CA&#8217;s mapping of each criterion to its controls, the CP/CPS sections and internal</text>
  <text class="body" x="300" y="308">policies that document them, and the evidence that demonstrates them.</text>
  <line x1="33" y1="324" x2="927" y2="324" stroke="#E7EDF1" stroke-width="1"/>

  <!-- Row 5: Policies & procedures (y=324) -->
  <rect x="33" y="334" width="4" height="38" rx="2" fill="#A8711C"/>
  <text class="artifact" x="48" y="358" fill="#A8711C">Policies &amp; procedures</text>
  <text class="body" x="300" y="349">The CP and CPS (the public, auditable commitments) plus internal</text>
  <text class="body" x="300" y="366">documents like key management, security, and incident response policies.</text>
  <line x1="33" y1="382" x2="927" y2="382" stroke="#E7EDF1" stroke-width="1"/>

  <!-- Row 6: Operational evidence (y=382) -->
  <rect x="33" y="392" width="4" height="38" rx="2" fill="#6D4A9C"/>
  <text class="artifact" x="48" y="416" fill="#6D4A9C">Operational evidence</text>
  <text class="body" x="300" y="407">Key ceremony records, HSM configuration, validation and issuance logs,</text>
  <text class="body" x="300" y="424">revocation records, training records, change history.</text>
  <line x1="33" y1="440" x2="927" y2="440" stroke="#E7EDF1" stroke-width="1"/>

  <!-- Row 7: Auditor testing (y=440) -->
  <rect x="33" y="450" width="4" height="38" rx="2" fill="#A84A38"/>
  <text class="artifact" x="48" y="474" fill="#A84A38">Auditor testing</text>
  <text class="body" x="300" y="465">The licensed practitioner&#8217;s procedures, sampling issuance records, observing</text>
  <text class="body" x="300" y="482">ceremonies, inspecting configurations against the control matrix.</text>
  <line x1="33" y1="498" x2="927" y2="498" stroke="#E7EDF1" stroke-width="1"/>

  <!-- Row 8: Audit conclusion (y=498) -->
  <rect x="33" y="508" width="4" height="38" rx="2" fill="#2E7D46"/>
  <text class="artifact" x="48" y="532" fill="#2E7D46">Audit conclusion</text>
  <text class="body" x="300" y="523">The practitioner&#8217;s report and opinion, published and filed with</text>
  <text class="body" x="300" y="540">root programs via the CCADB.</text>

  <line x1="33" y1="572" x2="927" y2="572" stroke="#D3DCE3" stroke-width="1"/>
</svg>
