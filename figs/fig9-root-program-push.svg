<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Chrome and Apple root program requirements driving CAs from one multi-purpose CP/CPS to service-scoped CPS documents">
  <style>
    .eyebrow { font: 600 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2.5px; fill:#66788A; }
    .t { font: 600 13.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#3F5DA8; }
    .sub { font: 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .mono { font: 600 12px 'SF Mono',Consolas,Menlo,monospace; fill:#7A5514; }
    .monosm { font: 600 10.5px 'SF Mono',Consolas,Menlo,monospace; fill:#7A5514; }
    .chip { font: 600 9px 'SF Mono',Consolas,Menlo,monospace; fill:#66788A; }
    .lab { font: italic 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .cap { font: italic 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66788A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>

  <text class="eyebrow" x="33" y="40">THE PUSH TO DISCRETE</text>

  <!-- root program cards (requirement-indigo: they are the source of the requirement) -->
  <rect x="120" y="60" width="330" height="66" rx="9" fill="#EDF1FA" stroke="#3F5DA8" stroke-width="1.5"/>
  <text class="t" x="285" y="84" text-anchor="middle">Chrome Root Program</text>
  <text class="sub" x="285" y="102" text-anchor="middle">CP/CPS focused on a single use case;</text>
  <text class="sub" x="285" y="116" text-anchor="middle">dedicated TLS hierarchies only</text>

  <rect x="510" y="60" width="330" height="66" rx="9" fill="#EDF1FA" stroke="#3F5DA8" stroke-width="1.5"/>
  <text class="t" x="675" y="84" text-anchor="middle">Apple Root Program</text>
  <text class="sub" x="675" y="102" text-anchor="middle">single-purpose roots required</text>
  <text class="sub" x="675" y="116" text-anchor="middle">for all new applicants</text>

  <!-- pressure lines onto the transition -->
  <line x1="285" y1="126" x2="425" y2="247" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="675" y1="126" x2="525" y2="247" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- left: the monolith -->
  <path d="M 100 180 h 126 l 24 24 v 156 h -150 z" fill="#FFFFFF" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 226 180 v 24 h 24 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="mono" x="175" y="212" text-anchor="middle">CP/CPS</text>
  <text class="sub" x="175" y="228" text-anchor="middle">all services</text>
  <rect x="118" y="244" width="110" height="5" rx="2.5" fill="#DFE6EB"/>
  <rect x="118" y="258" width="34" height="12" rx="6" fill="#FFFFFF" stroke="#9AA9B5" stroke-width="1"/>
  <text class="chip" x="135" y="267" text-anchor="middle">TLS</text>
  <rect x="160" y="261" width="68" height="5" rx="2.5" fill="#DFE6EB"/>
  <rect x="118" y="278" width="114" height="5" rx="2.5" fill="#DFE6EB"/>
  <rect x="118" y="292" width="48" height="12" rx="6" fill="#FFFFFF" stroke="#9AA9B5" stroke-width="1"/>
  <text class="chip" x="142" y="301" text-anchor="middle">S/MIME</text>
  <rect x="174" y="295" width="54" height="5" rx="2.5" fill="#DFE6EB"/>
  <rect x="118" y="312" width="100" height="5" rx="2.5" fill="#DFE6EB"/>
  <rect x="118" y="326" width="86" height="5" rx="2.5" fill="#DFE6EB"/>

  <!-- transition arrow -->
  <path d="M 300 256 L 598 256 L 598 240 L 648 271 L 598 302 L 598 286 L 300 286 Z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.6"/>

  <!-- right: the discrete set (2x2) -->
  <path d="M 675 180 h 94 l 18 18 v 62 h -112 z" fill="#FFFFFF" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 769 180 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="monosm" x="731" y="228" text-anchor="middle">TLS CPS</text>
  <path d="M 799 180 h 94 l 18 18 v 62 h -112 z" fill="#FFFFFF" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 893 180 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="monosm" x="855" y="228" text-anchor="middle">S/MIME CPS</text>
  <path d="M 675 272 h 94 l 18 18 v 62 h -112 z" fill="#FFFFFF" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 769 272 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="monosm" x="731" y="320" text-anchor="middle">Code Sign CPS</text>
  <path d="M 799 272 h 94 l 18 18 v 62 h -112 z" fill="#FFFFFF" stroke="#A8711C" stroke-width="1.6"/>
  <path d="M 893 272 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="monosm" x="855" y="320" text-anchor="middle">Doc Sign CPS</text>

  <!-- panel labels -->
  <text class="lab" x="175" y="392" text-anchor="middle">one multi-purpose CP/CPS</text>
  <text class="lab" x="793" y="392" text-anchor="middle">service-scoped CPS per family</text>

  <text class="cap" x="480" y="432" text-anchor="middle">Scope precision is becoming a condition of trust.</text>

  <line x1="33" y1="458" x2="927" y2="458" stroke="#D3DCE3" stroke-width="1"/>
</svg>
