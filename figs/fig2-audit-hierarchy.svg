<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-label="The audit artifact hierarchy from management assertion down to audit conclusion">
  <style>
    .eyebrow { font: 600 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 2.5px; fill:#66788A; }
    .label { font: 600 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .boxsub { font: 11px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .cap { font: italic 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#66788A; }
    .mono { font: 600 11px 'SF Mono',Consolas,Menlo,monospace; fill:#7A5514; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66788A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="690" fill="#FFFFFF"/>

  <text class="eyebrow" x="33" y="40">THE AUDIT ARTIFACT HIERARCHY</text>

  <!-- Management assertion -->
  <rect x="190" y="70" width="340" height="46" rx="9" fill="#EFF3F6" stroke="#26323F" stroke-width="1.5"/>
  <text class="label" x="360" y="98" text-anchor="middle" fill="#26323F">Management assertion</text>
  <line x1="546" y1="93" x2="704" y2="93" stroke="#D3DCE3" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="cap" x="712" y="88">What does management</text>
  <text class="cap" x="712" y="104">claim is true?</text>
  <line x1="360" y1="116" x2="360" y2="138" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- Audit scope -->
  <rect x="190" y="142" width="340" height="46" rx="9" fill="#EDF1FA" stroke="#3F5DA8" stroke-width="1.5"/>
  <text class="label" x="360" y="170" text-anchor="middle" fill="#3F5DA8">Audit scope &amp; applicable criteria</text>
  <line x1="546" y1="165" x2="704" y2="165" stroke="#D3DCE3" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="cap" x="712" y="152">Which services, systems,</text>
  <text class="cap" x="712" y="168">periods, and criteria</text>
  <text class="cap" x="712" y="184">are examined?</text>
  <line x1="360" y1="188" x2="360" y2="210" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- Control matrix (emphasized) -->
  <rect x="190" y="214" width="340" height="58" rx="9" fill="#E7F3F0" stroke="#1E7A6C" stroke-width="2.5"/>
  <text class="label" x="360" y="238" text-anchor="middle" fill="#1E7A6C">Control matrix</text>
  <text class="boxsub" x="360" y="257" text-anchor="middle">requirement &#8594; control &#8594; document &#8594; evidence</text>
  <line x1="546" y1="243" x2="704" y2="243" stroke="#D3DCE3" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="cap" x="712" y="230">How does the CA believe</text>
  <text class="cap" x="712" y="246">each requirement</text>
  <text class="cap" x="712" y="262">is satisfied?</text>

  <!-- fan-out lines from matrix bottom to five document cards -->
  <line x1="250" y1="272" x2="88"  y2="308" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="305" y1="272" x2="224" y2="308" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="360" y1="272" x2="360" y2="308" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="415" y1="272" x2="496" y2="308" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="470" y1="272" x2="632" y2="308" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- five document cards: w=124 h=78, centers 88,224,360,496,632, y=312 -->
  <!-- TLS CPS -->
  <path d="M 26 312 h 106 l 18 18 v 60 h -124 z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.5"/>
  <path d="M 132 312 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="mono" x="88" y="356" text-anchor="middle">TLS</text>
  <text class="mono" x="88" y="372" text-anchor="middle">CPS</text>
  <!-- S/MIME CPS -->
  <path d="M 162 312 h 106 l 18 18 v 60 h -124 z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.5"/>
  <path d="M 268 312 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="mono" x="224" y="356" text-anchor="middle">S/MIME</text>
  <text class="mono" x="224" y="372" text-anchor="middle">CPS</text>
  <!-- Code Signing CPS -->
  <path d="M 298 312 h 106 l 18 18 v 60 h -124 z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.5"/>
  <path d="M 404 312 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="mono" x="360" y="356" text-anchor="middle">Code Signing</text>
  <text class="mono" x="360" y="372" text-anchor="middle">CPS</text>
  <!-- Doc Signing CPS -->
  <path d="M 434 312 h 106 l 18 18 v 60 h -124 z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.5"/>
  <path d="M 540 312 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="mono" x="496" y="356" text-anchor="middle">Doc Signing</text>
  <text class="mono" x="496" y="372" text-anchor="middle">CPS</text>
  <!-- Internal policies -->
  <path d="M 570 312 h 106 l 18 18 v 60 h -124 z" fill="#FAF2E3" stroke="#A8711C" stroke-width="1.5"/>
  <path d="M 676 312 v 18 h 18 z" fill="#F0DFBE" stroke="#A8711C" stroke-width="1.2"/>
  <text class="mono" x="632" y="356" text-anchor="middle">Internal</text>
  <text class="mono" x="632" y="372" text-anchor="middle">Policies</text>

  <text class="cap" x="712" y="345">What does the organization</text>
  <text class="cap" x="712" y="361">say it does?</text>

  <!-- converge lines from card bottoms to evidence top -->
  <line x1="88"  y1="390" x2="250" y2="426" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="224" y1="390" x2="305" y2="426" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="360" y1="390" x2="360" y2="426" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="496" y1="390" x2="415" y2="426" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="632" y1="390" x2="470" y2="426" stroke="#66788A" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- Operational evidence -->
  <rect x="190" y="430" width="340" height="46" rx="9" fill="#F1EDF8" stroke="#6D4A9C" stroke-width="1.5"/>
  <text class="label" x="360" y="458" text-anchor="middle" fill="#6D4A9C">Operational evidence</text>
  <line x1="546" y1="453" x2="704" y2="453" stroke="#D3DCE3" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="cap" x="712" y="458">What actually happened?</text>
  <line x1="360" y1="476" x2="360" y2="498" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- Auditor testing -->
  <rect x="190" y="502" width="340" height="46" rx="9" fill="#F8ECE9" stroke="#A84A38" stroke-width="1.5"/>
  <text class="label" x="360" y="530" text-anchor="middle" fill="#A84A38">Auditor testing</text>
  <line x1="546" y1="525" x2="704" y2="525" stroke="#D3DCE3" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="cap" x="712" y="512">Does the evidence support</text>
  <text class="cap" x="712" y="528">the claimed operation</text>
  <text class="cap" x="712" y="544">of the control?</text>
  <line x1="360" y1="548" x2="360" y2="570" stroke="#66788A" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- Audit conclusion -->
  <rect x="190" y="574" width="340" height="46" rx="9" fill="#EAF4EE" stroke="#2E7D46" stroke-width="1.5"/>
  <text class="label" x="360" y="602" text-anchor="middle" fill="#2E7D46">Audit conclusion</text>
  <line x1="546" y1="597" x2="704" y2="597" stroke="#D3DCE3" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="cap" x="712" y="592">Are the criteria satisfied</text>
  <text class="cap" x="712" y="608">within the defined scope?</text>

  <line x1="33" y1="656" x2="927" y2="656" stroke="#D3DCE3" stroke-width="1"/>
</svg>
